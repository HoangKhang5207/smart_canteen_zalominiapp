name: Mini App CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Type-check, Vitest & Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Vitest unit tests
        run: npm test

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: |
          npm run build
          test -f www/index.html

  security-audit:
    name: npm Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          load: true
          push: false
          tags: smart-canteen-miniapp:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production Nginx container
        run: |
          USER_ID=$(docker run --rm --entrypoint id smart-canteen-miniapp:ci -u)
          echo "Container UID: $USER_ID"
          test "$USER_ID" != "0"
          docker run -d --name miniapp-ci-smoke -p 127.0.0.1:8080:8080 smart-canteen-miniapp:ci
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q "ok"; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q "ok"
          curl -fsS http://127.0.0.1:8080/ | grep -qi "html"

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f miniapp-ci-smoke || true
